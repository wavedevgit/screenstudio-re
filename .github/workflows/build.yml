name: build

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  linux:
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev pkg-config
      - run: go vet ./...
      - run: go test ./core
      - run: go build -o screenstudio-re-linux-amd64 .
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./core
      - run: go build -o screenstudio-re-windows-amd64.exe .
        env:
          CGO_ENABLED: "0"
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev pkg-config
      - run: go build -o screenstudio-re-linux-amd64 .
      - run: go build -o screenstudio-re-windows-amd64.exe .
        env:
          GOOS: windows
          CGO_ENABLED: "0"
      - run: gh release create "$GITHUB_REF_NAME" screenstudio-re-linux-amd64 screenstudio-re-windows-amd64.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
